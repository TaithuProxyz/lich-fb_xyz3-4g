<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kho Link Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16'
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans antialiased pb-20">
    <div class="max-w-2xl mx-auto px-2.5 pt-2.5">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-darkBg/95 backdrop-blur-sm pb-2 pt-0.5 border-b border-slate-800 mb-2">
            <div class="flex items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-1.5 min-w-0">
                    <h1 class="text-sm sm:text-base font-bold text-white truncate">🔗 Kho Link Affiliate</h1>
                    <span id="itemCount" class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-800 text-blue-400 border border-slate-700 shrink-0">0 SP</span>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="exportLinks()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2 py-1 rounded-lg text-[11px] font-semibold transition" title="Xuất file JSON">
                        📥
                    </button>
                    <button onclick="document.getElementById('importInput').click()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2 py-1 rounded-lg text-[11px] font-semibold transition" title="Nhập file JSON">
                        📤
                    </button>
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="importLinks(event)">
                    <button onclick="openProductModal()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-2.5 py-1 rounded-lg text-[11px] font-bold shadow transition flex items-center gap-1">
                        ➕ Thêm SP
                    </button>
                </div>
            </div>

            <!-- Tag danh mục dạng wrap xuống hàng -->
            <div id="tabsBar" class="flex flex-wrap items-center gap-1.5 pb-1.5 mb-1.5 border-b border-slate-800/80"></div>

            <!-- Thanh tìm kiếm nhanh -->
            <div class="relative">
                <input id="searchInput" type="text" oninput="renderList()" placeholder="🔍 Tìm tên sản phẩm hoặc link..."
                    class="w-full bg-slate-900 border border-slate-700 focus:border-blue-500 rounded-lg pl-2.5 pr-7 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs">✕</button>
            </div>
        </header>

        <!-- Danh sách sản phẩm dạng 1 cột -->
        <main id="productList" class="grid grid-cols-1 gap-2"></main>
    </div>

    <!-- Modal Thêm / Sửa Sản Phẩm -->
    <div id="productModal" class="fixed inset-0 bg-black/80 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50" onclick="closeProductModal()">
        <div class="bg-slate-900 border-t-2 sm:border-2 border-blue-500/80 rounded-t-2xl sm:rounded-2xl p-3.5 w-full max-w-md max-h-[88vh] overflow-y-auto shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800">
                <h2 id="modalTitle" class="text-sm font-bold text-white">➕ Thêm Sản Phẩm Mới</h2>
                <button onclick="closeProductModal()" class="text-slate-400 hover:text-white text-sm px-1.5 py-0.5">✕</button>
            </div>

            <form onsubmit="saveProduct(event)" class="flex flex-col gap-2.5">
                <input type="hidden" id="editId">

                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">Tab danh mục</label>
                    <select id="productTabSelect"
                        class="w-full bg-darkBg border border-slate-700 focus:border-blue-500 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none"></select>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-1">Tên sản phẩm *</label>
                    <input id="productName" type="text" required placeholder="VD: Pate mèo, Máy khoan pin..."
                        class="w-full bg-darkBg border border-slate-700 focus:border-blue-500 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-[11px] font-semibold text-slate-300">Danh sách link</label>
                        <button type="button" onclick="addLinkRow()" class="text-xs font-bold text-blue-300 hover:text-white bg-blue-600/30 hover:bg-blue-600/50 border border-blue-500/50 px-2.5 py-1 rounded-lg transition">
                            + Thêm ô link
                        </button>
                    </div>
                    <div id="linkInputsContainer" class="flex flex-col gap-1.5"></div>
                </div>

                <div class="flex items-center gap-2 pt-2 border-t border-slate-800 mt-1">
                    <button type="button" onclick="closeProductModal()" class="flex-1 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition">
                        Hủy
                    </button>
                    <button type="submit" class="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold shadow transition">
                        Lưu lại
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Thêm / Quản Lý Tab -->
    <div id="tabModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50" onclick="closeTabModal()">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-3.5 w-full max-w-xs shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between pb-2 mb-2.5 border-b border-slate-800">
                <h2 class="text-xs font-bold text-white">🗂️ Thêm Tab Mới</h2>
                <button onclick="closeTabModal()" class="text-slate-400 hover:text-white text-xs px-1">✕</button>
            </div>

            <form onsubmit="addNewTab(event)" class="flex gap-1.5 mb-3">
                <input id="newTabName" type="text" required placeholder="VD: Chó mèo, Điện..."
                    class="flex-1 bg-darkBg border border-slate-700 focus:border-blue-500 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none">
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0">
                    Thêm
                </button>
            </form>

            <div class="border-t border-slate-800 pt-2">
                <div class="text-[10px] text-slate-400 mb-1.5 font-semibold">Các tab hiện có:</div>
                <div id="manageTabsList" class="flex flex-col gap-1.5 max-h-44 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'affiliate_links_v3';
        let store = {
            tabs: ['Chó mèo', 'Điện'],
            activeTab: 'Chó mèo',
            products: []
        };

        function loadStore() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('affiliate_links_v2');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed)) {
                        store.products = parsed.map(p => ({ ...p, tab: p.tab || store.tabs[0] }));
                    } else if (parsed && typeof parsed === 'object') {
                        store.tabs = Array.isArray(parsed.tabs) && parsed.tabs.length ? parsed.tabs : ['Chó mèo', 'Điện'];
                        store.products = Array.isArray(parsed.products) ? parsed.products : [];
                        if (parsed.activeTab && store.tabs.includes(parsed.activeTab)) {
                            store.activeTab = parsed.activeTab;
                        } else {
                            store.activeTab = store.tabs[0];
                        }
                    }
                }
            } catch (e) {
                store = { tabs: ['Chó mèo', 'Điện'], activeTab: 'Chó mèo', products: [] };
            }
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
        }

        function switchTab(tabName) {
            if (!store.tabs.includes(tabName)) return;
            store.activeTab = tabName;
            saveToStorage();
            renderTabs();
            renderList();
        }

        function renderTabs() {
            const bar = document.getElementById('tabsBar');

            if (store.tabs.length === 0) {
                store.tabs = ['Chó mèo'];
                store.activeTab = 'Chó mèo';
            }
            if (!store.tabs.includes(store.activeTab)) {
                store.activeTab = store.tabs[0];
            }

            let html = store.tabs.map(t => {
                const isActive = store.activeTab === t;
                const count = store.products.filter(p => p.tab === t).length;
                return `
                    <button type="button" onclick="switchTab('${escapeJs(t)}')"
                        class="px-3 py-1.5 rounded-lg text-xs font-bold leading-none transition flex items-center gap-1 ${
                            isActive
                                ? 'bg-blue-600 text-white border border-blue-400 shadow'
                                : 'bg-slate-800/90 text-slate-200 hover:bg-slate-700 border border-slate-700'
                        }">
                        <span>${escapeHtml(t)}</span>
                        <span class="text-[11px] px-1.5 py-0.5 rounded-full ${isActive ? 'bg-blue-800/80 text-blue-100' : 'bg-slate-900/90 text-slate-400'}">${count}</span>
                    </button>
                `;
            }).join('');

            html += `
                <button type="button" onclick="openTabModal()"
                    class="px-3 py-1.5 rounded-lg text-xs font-bold leading-none bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-dashed border-emerald-500/60 transition flex items-center gap-1"
                    title="Thêm hoặc xóa tab">
                    + Tab
                </button>
            `;

            bar.innerHTML = html;
        }

        function openTabModal() {
            document.getElementById('newTabName').value = '';
            renderManageTabsList();
            document.getElementById('tabModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('newTabName').focus(), 50);
        }

        function closeTabModal() {
            document.getElementById('tabModal').classList.add('hidden');
        }

        function renderManageTabsList() {
            const box = document.getElementById('manageTabsList');
            box.innerHTML = store.tabs.map(t => `
                <div class="flex items-center justify-between bg-darkBg/90 border border-slate-800 rounded-lg px-2.5 py-1.5">
                    <span class="text-xs font-semibold text-slate-200 truncate">${escapeHtml(t)}</span>
                    ${store.tabs.length > 1
                        ? `<button type="button" onclick="deleteTab('${escapeJs(t)}')" class="text-[11px] text-rose-400 hover:text-rose-300 px-1.5 py-0.5 rounded bg-slate-900 border border-slate-800 shrink-0">Xóa</button>`
                        : `<span class="text-[10px] text-slate-500">Mặc định</span>`
                    }
                </div>
            `).join('');
        }

        function addNewTab(e) {
            e.preventDefault();
            const input = document.getElementById('newTabName');
            const name = input.value.trim();
            if (!name) return;

            if (!store.tabs.includes(name)) {
                store.tabs.push(name);
            }
            store.activeTab = name;
            saveToStorage();
            input.value = '';
            renderTabs();
            renderManageTabsList();
            renderList();
        }

        function deleteTab(tabName) {
            if (store.tabs.length <= 1) {
                alert('Cần giữ lại ít nhất 1 tab.');
                return;
            }
            const hasProducts = store.products.some(p => p.tab === tabName);
            const remainingTabs = store.tabs.filter(t => t !== tabName);
            const fallbackTab = remainingTabs[0];

            if (hasProducts && !confirm(`Tab "${tabName}" đang có sản phẩm. Chuyển các SP sang tab "${fallbackTab}" và xóa tab "${tabName}"?`)) {
                return;
            }

            store.tabs = remainingTabs;
            store.products.forEach(p => {
                if (p.tab === tabName) p.tab = fallbackTab;
            });
            if (store.activeTab === tabName) {
                store.activeTab = fallbackTab;
            }
            saveToStorage();
            renderTabs();
            renderManageTabsList();
            renderList();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            renderList();
            input.focus();
        }

        // Luôn cuộn ô input link về cuối để thấy đuôi link
        function scrollInputToEnd(el) {
            if (!el) return;
            requestAnimationFrame(() => {
                el.scrollLeft = el.scrollWidth;
            });
        }

        function scrollAllLinkInputsToEnd() {
            document.querySelectorAll('.link-tail-input').forEach(el => {
                el.scrollLeft = el.scrollWidth;
            });
        }

        function addInlineLink(productId) {
            const prod = store.products.find(p => String(p.id) === String(productId));
            if (!prod) return;
            if (!Array.isArray(prod.links)) prod.links = [];
            prod.links.push('');
            saveToStorage();
            renderList();
            const newIdx = prod.links.length - 1;
            setTimeout(() => {
                const el = document.getElementById(`inline-input-${productId}-${newIdx}`);
                if (el) el.focus();
            }, 30);
        }

        function updateInlineLink(productId, linkIdx, newVal, inputEl) {
            const prod = store.products.find(p => String(p.id) === String(productId));
            if (!prod || !Array.isArray(prod.links)) return;
            prod.links[linkIdx] = newVal.trim();
            saveToStorage();
            scrollInputToEnd(inputEl);
        }

        function removeInlineLink(productId, linkIdx) {
            const prod = store.products.find(p => String(p.id) === String(productId));
            if (!prod || !Array.isArray(prod.links)) return;
            if (prod.links.length <= 1) {
                prod.links[0] = '';
            } else {
                prod.links.splice(linkIdx, 1);
            }
            saveToStorage();
            renderList();
        }

        function openTestLink(productId, linkIdx) {
            const inputEl = document.getElementById(`inline-input-${productId}-${linkIdx}`);
            let url = inputEl ? inputEl.value.trim() : '';
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function renderList() {
            const listEl = document.getElementById('productList');
            const countEl = document.getElementById('itemCount');
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearSearchBtn');
            const query = searchInput.value.trim().toLowerCase();

            clearBtn.classList.toggle('hidden', query.length === 0);

            const byTab = store.products.filter(p => p.tab === store.activeTab);

            const filtered = byTab.filter(p => {
                if (!query) return true;
                const matchName = (p.name || '').toLowerCase().includes(query);
                const matchLinks = (p.links || []).some(l =>
                    (typeof l === 'string' ? l : (l.url || '')).toLowerCase().includes(query)
                );
                return matchName || matchLinks;
            });

            countEl.innerText = `${filtered.length}/${byTab.length} SP`;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="bg-slate-900/70 border border-dashed border-slate-700 rounded-xl p-5 text-center">
                        <p class="text-xs text-slate-400 mb-2">
                            ${query ? 'Không tìm thấy sản phẩm khớp từ khóa.' : `Chưa có sản phẩm nào trong tab "${escapeHtml(store.activeTab)}".`}
                        </p>
                        ${!query ? `<button onclick="openProductModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">➕ Thêm sản phẩm</button>` : ''}
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map((p, idx) => {
                const isRedBorder = idx % 2 === 1;
                const cardBorderClass = isRedBorder
                    ? 'border-red-500/80 hover:border-red-400'
                    : 'border-emerald-500/80 hover:border-emerald-400';

                const rawLinks = (p.links && p.links.length > 0)
                    ? p.links.map(l => typeof l === 'string' ? l : (l.url || ''))
                    : [''];

                const linksHtml = rawLinks.map((url, lIdx) => {
                    const inputId = `inline-input-${p.id}-${lIdx}`;
                    const copyId = `copy-btn-${p.id}-${lIdx}`;
                    const canRemove = rawLinks.length > 1;

                    return `
                        <div class="flex items-center gap-1.5 bg-darkBg/95 border border-slate-800 rounded-lg p-1.5 min-w-0">
                            <input id="${inputId}" type="text" value="${escapeAttr(url)}"
                                placeholder="Dán/sửa link..."
                                onchange="updateInlineLink('${p.id}', ${lIdx}, this.value, this)"
                                onblur="scrollInputToEnd(this)"
                                class="link-tail-input flex-1 min-w-0 bg-transparent text-xs font-mono text-slate-200 focus:text-white focus:bg-slate-900 focus:outline-none rounded px-1.5 py-1">
                            ${canRemove ? `
                                <button type="button" onclick="removeInlineLink('${p.id}', ${lIdx})"
                                    title="Bớt link này"
                                    class="shrink-0 text-slate-500 hover:text-rose-400 px-1.5 py-1 rounded text-xs font-bold transition leading-none">
                                    ✕
                                </button>
                            ` : ''}
                            <button id="${copyId}" type="button"
                                onclick="copyInlineInput(this, '${inputId}')"
                                class="shrink-0 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-4 py-1.5 rounded-md text-xs font-bold transition leading-none shadow">
                                Copy
                            </button>
                            <button type="button"
                                onclick="openTestLink('${p.id}', ${lIdx})"
                                title="Truy cập test link"
                                class="shrink-0 bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white border border-slate-700 hover:border-blue-400 px-2 py-1.5 rounded-md text-xs font-bold transition leading-none">
                                ↗
                            </button>
                        </div>
                    `;
                }).join('');

                return `
                    <article class="bg-slate-900 border-2 ${cardBorderClass} rounded-xl p-2 flex flex-col justify-between shadow-sm transition min-w-0">
                        <div class="flex items-center justify-between gap-1 mb-1 pb-0.5 border-b border-slate-800/90 leading-none">
                            <h2 class="text-xs font-bold text-white leading-none py-0.5 truncate flex-1" title="${escapeAttr(p.name)}">${escapeHtml(p.name)}</h2>
                            <div class="flex items-center gap-1 shrink-0 leading-none">
                                <button type="button" onclick="addInlineLink('${p.id}')" class="text-emerald-400 hover:text-emerald-300 bg-slate-800/90 hover:bg-slate-700 px-1.5 py-0.5 rounded text-xs font-bold leading-none transition" title="Thêm ô link">+</button>
                                <button type="button" onclick="openProductModal('${p.id}')" class="text-slate-400 hover:text-white px-1 py-0.5 rounded text-[11px] leading-none transition" title="Sửa tên/tab">✏️</button>
                                <button type="button" onclick="deleteProduct('${p.id}')" class="text-slate-400 hover:text-rose-400 px-1 py-0.5 rounded text-[11px] leading-none transition" title="Xóa SP">🗑</button>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            ${linksHtml}
                        </div>
                    </article>
                `;
            }).join('');

            requestAnimationFrame(scrollAllLinkInputsToEnd);
        }

        window.addEventListener('resize', scrollAllLinkInputsToEnd);

        async function copyInlineInput(btnEl, inputId) {
            const inputEl = document.getElementById(inputId);
            const url = inputEl ? inputEl.value.trim() : '';
            if (!url) return;

            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(url);
                } else {
                    fallbackCopy(url);
                }
            } catch (e) {
                fallbackCopy(url);
            }

            if (!btnEl) return;
            const oldText = btnEl.innerText;
            btnEl.innerText = '✓ Xong';
            btnEl.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            btnEl.classList.add('bg-blue-600');

            setTimeout(() => {
                btnEl.innerText = oldText;
                btnEl.classList.remove('bg-blue-600');
                btnEl.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
            }, 1000);
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
        }

        function addLinkRow(url = '') {
            const container = document.getElementById('linkInputsContainer');
            const row = document.createElement('div');
            row.className = 'link-row flex items-center gap-1.5';
            row.innerHTML = `
                <input type="text" value="${escapeAttr(url)}" placeholder="Nhập hoặc dán link..."
                    class="link-url flex-1 min-w-0 bg-darkBg border border-slate-700 focus:border-blue-500 rounded-lg px-2.5 py-2 text-xs font-mono text-white focus:outline-none">
                <button type="button" onclick="removeLinkRow(this)" class="bg-slate-800 hover:bg-rose-950 text-rose-400 px-2.5 py-2 rounded-lg text-xs font-bold transition shrink-0" title="Xóa ô link">
                    ✕
                </button>
            `;
            container.appendChild(row);
        }

        function removeLinkRow(btn) {
            const container = document.getElementById('linkInputsContainer');
            if (container.querySelectorAll('.link-row').length <= 1) {
                alert('Cần ít nhất 1 ô link.');
                return;
            }
            btn.closest('.link-row').remove();
        }

        function populateTabSelect(selectedTab) {
            const select = document.getElementById('productTabSelect');
            select.innerHTML = store.tabs.map(t =>
                `<option value="${escapeAttr(t)}" ${t === selectedTab ? 'selected' : ''}>${escapeHtml(t)}</option>`
            ).join('');
        }

        function openProductModal(productId = null) {
            const modal = document.getElementById('productModal');
            const title = document.getElementById('modalTitle');
            const editId = document.getElementById('editId');
            const nameInput = document.getElementById('productName');
            const linkContainer = document.getElementById('linkInputsContainer');

            linkContainer.innerHTML = '';

            if (productId) {
                const found = store.products.find(item => String(item.id) === String(productId));
                if (!found) return;
                title.innerText = '✏️ Sửa Sản Phẩm';
                editId.value = found.id;
                nameInput.value = found.name || '';
                populateTabSelect(found.tab || store.activeTab);
                const list = (found.links && found.links.length > 0)
                    ? found.links.map(l => typeof l === 'string' ? l : (l.url || ''))
                    : [''];
                list.forEach(u => addLinkRow(u));
            } else {
                title.innerText = '➕ Thêm Sản Phẩm Mới';
                editId.value = '';
                nameInput.value = '';
                populateTabSelect(store.activeTab);
                addLinkRow('');
            }

            modal.classList.remove('hidden');
            setTimeout(() => nameInput.focus(), 50);
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            const idVal = document.getElementById('editId').value;
            const name = document.getElementById('productName').value.trim();
            const tab = document.getElementById('productTabSelect').value;
            if (!name) return;

            const links = Array.from(document.querySelectorAll('#linkInputsContainer .link-url'))
                .map(input => input.value.trim())
                .filter(Boolean);

            if (links.length === 0) {
                links.push('');
            }

            if (idVal) {
                const idx = store.products.findIndex(item => String(item.id) === String(idVal));
                if (idx !== -1) {
                    store.products[idx] = { ...store.products[idx], name, tab, links };
                }
            } else {
                store.products.unshift({
                    id: Date.now().toString(),
                    name,
                    tab,
                    links
                });
            }

            store.activeTab = tab;
            saveToStorage();
            closeProductModal();
            renderTabs();
            renderList();
        }

        function deleteProduct(productId) {
            if (!confirm('Xóa sản phẩm này?')) return;
            store.products = store.products.filter(item => String(item.id) !== String(productId));
            saveToStorage();
            renderTabs();
            renderList();
        }

        function exportLinks() {
            const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `affiliate_links_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function importLinks(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        store.products = parsed;
                    } else if (parsed && Array.isArray(parsed.products)) {
                        store.tabs = Array.isArray(parsed.tabs) && parsed.tabs.length ? parsed.tabs : store.tabs;
                        store.products = parsed.products;
                        if (!store.tabs.includes(store.activeTab)) {
                            store.activeTab = store.tabs[0];
                        }
                    } else {
                        alert('File JSON không đúng định dạng.');
                        return;
                    }
                    saveToStorage();
                    renderTabs();
                    renderList();
                    alert('Đã nhập dữ liệu thành công.');
                } catch (err) {
                    alert('Không thể đọc file JSON.');
                }
            };
            reader.readAsText(file, 'UTF-8');
            event.target.value = '';
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function escapeJs(str) {
            return String(str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;');
        }

        loadStore();
        renderTabs();
        renderList();
    </script>
</body>
</html>
